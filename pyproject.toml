[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gromacs-web-ui"
version = "0.2.10"
description = "Local Web UI and worker for GROMACS workflows"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "yzk"}]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
    "playwright==1.62.0",
]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/**/*", "templates/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "gromacs_integration: runs real, single-threaded GROMACS commands (enable with GROMACS_INTEGRATION=1 or -m gromacs_integration)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["runtime", "forcefields"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PERF", "PIE", "RUF", "SIM", "UP"]
ignore = [
    # Chinese UI text intentionally uses full-width punctuation.
    "RUF001", "RUF002", "RUF003",
    # FastAPI declares parameters with Query()/File()/Depends() defaults.
    "B008",
    # Closures in loops here are invoked immediately (thread pool, Playwright routes).
    "B023",
    # Nested `with` blocks are kept where they mirror lock/resource ordering.
    "SIM117",
    # Explicit append loops are kept where they read more clearly.
    "PERF401",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI copies list defaults per request.
"app/main.py" = ["B006"]
# Test fixtures use class-level constant dictionaries.
"tests/**" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
