[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gromacs-web-ui"
version = "0.2.6"
description = "Local Web UI and worker for GROMACS workflows"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "yzk"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "matplotlib==3.10.8",
    "numpy>=2.0,<3",
    "MDAnalysis==2.10.0",
    "biopython==1.87",
    "python-multipart==0.0.31",
    "typing-extensions==4.16.0",
    "uvicorn[standard]==0.30.3",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/**/*", "templates/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["runtime", "forcefields"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
