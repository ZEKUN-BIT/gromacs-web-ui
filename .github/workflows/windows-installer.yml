name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'tests/test_windows*.py'
      - 'tests/windows_setup.Tests.ps1'
      - 'tests/windows_console.Tests.ps1'
      - 'tests/windows_host.Tests.ps1'
      - 'tests/windows_signing.Tests.ps1'
      - 'tests/windows_installer.Tests.ps1'
      - 'docs/QUICKSTART.md'
      - 'docs/RELEASE-CHECKLIST.md'
      - 'app/static/examples/**'
      - '.github/workflows/windows-installer.yml'

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v, "Tag must match pyproject.toml version"'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check Linux scripts and installer behavior
        run: |
          bash -n packaging/windows/*.sh
          python -m pytest tests/test_windows*.py -q
  package:
    needs: linux-checks
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
      - name: Test real WSL CLI and mocked provisioning without changing the runner
        shell: powershell
        run: |
          ./tests/windows_setup.Tests.ps1 -RequireWindowsWsl
          ./tests/windows_console.Tests.ps1
          ./tests/windows_host.Tests.ps1
          ./tests/windows_signing.Tests.ps1
      - name: Test PowerShell 7 launcher and provisioning compatibility
        shell: pwsh
        run: |
          ./tests/windows_setup.Tests.ps1 -RequireWindowsWsl
          ./tests/windows_console.Tests.ps1
          ./tests/windows_host.Tests.ps1
          ./tests/windows_signing.Tests.ps1
      - name: Install NSIS compiler
        shell: powershell
        timeout-minutes: 10
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'nsis-3.13-setup.exe'
          $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe'
          # Hash verified against microsoft/winget-pkgs at ca8886c3aef0edcbb4f29552f23a4a5b9599305f.
          $expectedHash = 'DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              # SourceForge sends an HTML download page to the PowerShell user agent.
              curl.exe --fail --location --proto '=https' --proto-redir '=https' --user-agent 'curl/8.14.1' --connect-timeout 20 --max-time 90 --output $installer $url
              if ($LASTEXITCODE -ne 0) { throw "NSIS download failed: curl exit $LASTEXITCODE" }
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "NSIS download failed; retrying attempt $($attempt + 1) of 3."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          try {
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) {
              throw "NSIS compiler installer checksum mismatch: $actualHash ($((Get-Item -LiteralPath $installer).Length) bytes)."
            }
            $setup = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "NSIS installation failed: $($setup.ExitCode)" }
            if (-not (Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler was not installed.' }
            $compilerVersion = & $compiler -VERSION
            if ($LASTEXITCODE -ne 0 -or $compilerVersion.Trim() -ne 'v3.13') {
              throw "Unexpected NSIS compiler version: $compilerVersion"
            }
          } finally {
            Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
          }
      - name: Build setup.exe and portable archive
        shell: powershell
        run: python packaging/windows/build.py --makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Verify the actual Simplified Chinese installer welcome page
        shell: powershell
        timeout-minutes: 2
        run: |
          $installers = @(Get-ChildItem -File dist/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one freshly built installer." }
          ./tests/windows_installer.Tests.ps1 -Installer $installers[0].FullName -RequireWindows -ReportFile dist/windows-installer-ui.json
      - name: Preserve installer UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-ui-failure
          path: dist/windows-installer-ui.json
          if-no-files-found: ignore
      - name: Sign installer when a publisher certificate is configured
        shell: powershell
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
        run: |
          $installers = @(Get-ChildItem -File dist/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one freshly built installer." }
          ./packaging/windows/Sign-Installer.ps1 -Installer $installers[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: GromacsConsole-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-windows-x64.zip
            dist/*.sha256
            dist/windows-signing.json
            dist/windows-installer-ui.json
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GromacsConsole-windows-x64
          path: dist
      - name: Prepare reviewable release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path('dist/windows-signing.json').read_text(encoding='utf-8-sig'))
          notes = Path('docs/RELEASE-NOTES.md').read_text()
          notes += '\n\n构建信息\n\n'
          notes += f"- 标签：{os.environ['RELEASE_TAG']}\n- 源码提交：{os.environ['SOURCE_COMMIT']}\n"
          notes += f"- EXE 签名：{status['status']}（{status['reason']}）\n"
          notes += '- Windows 实机验收：待维护者按 docs/RELEASE-CHECKLIST.md 填写；CI 产物不代表实机通过。\n'
          Path('dist/release-notes.md').write_text(notes)
          PY
      - name: Create or update a draft without publishing it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > dist/release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("dist/release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "GROMACS Console $RELEASE_TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*-setup.exe dist/*-windows-x64.zip dist/*.sha256 dist/windows-signing.json dist/windows-installer-ui.json --clobber
