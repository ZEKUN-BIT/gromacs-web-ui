name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gromacs: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes that affect simulations and analysis
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | python scripts/check_gromacs_changes.py >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.lock
      - run: python scripts/lock_dependencies.py --check
      - name: Validate the runtime lock in a fresh-environment resolution
        run: |
          python -m pip install --dry-run --ignore-installed --require-hashes --only-binary=:all: -r requirements/runtime.lock
      - name: Install locked development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: ruff check app scripts tests
      - run: ruff format --check app tests
      - run: python scripts/sync_frontend_assets.py --check
      - name: Lint frontend modules
        if: matrix.python-version == '3.12'
        run: |
          npm ci --no-audit --no-fund
          npm run lint
      - run: pytest -m "not gromacs_integration" --cov=app --cov-report=term
      - name: Install browser test tools
        if: matrix.python-version == '3.12'
        run: |
          python -m playwright install --with-deps chromium
      - name: Check history navigation and confirmation dialogs in Chromium
        if: matrix.python-version == '3.12'
        run: |
          node scripts/check_frontend_state.mjs
          node scripts/check_analysis_state.mjs
          node scripts/check_structure_data.mjs
          python scripts/check_frontend_browser.py
          python scripts/check_analysis_browser.py
          python scripts/check_agent_browser.py
          python scripts/check_agent_content_browser.py
          python scripts/check_storage_browser.py
          python scripts/check_product_browser.py
      - name: Check submission validation and task connection recovery
        if: matrix.python-version == '3.12'
        run: |
          python scripts/check_submission_browser.py --artifact-dir runtime/frontend-quality/submission
          python scripts/check_connection_browser.py
          python scripts/check_resilience_browser.py
      - name: Check viewport-limited plot rendering
        if: matrix.python-version == '3.12'
        run: python scripts/check_plot_rendering_browser.py --output runtime/frontend-quality/plot-rendering.json
      - name: Check accessibility, visual snapshots and frontend budgets
        if: matrix.python-version == '3.12'
        run: python scripts/check_frontend_quality.py --artifact-dir runtime/frontend-quality
      - name: Preserve frontend quality diagnostics on failure
        if: failure() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ matrix.python-version }}
          path: runtime/frontend-quality/
          if-no-files-found: ignore
          retention-days: 3

  browser-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium firefox
      - name: Check native fonts, high contrast and responsive layouts
        run: python scripts/check_platform_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-platforms-${{ matrix.os }}
          path: runtime/frontend-quality/platform/
          if-no-files-found: ignore
          retention-days: 3

  gromacs-integration:
    needs: changes
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.gromacs == 'true')
    # Match the WSL distribution and avoid ubuntu-latest repository transitions.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GROMACS_INTEGRATION: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      GMX_DISABLE_GPU_DETECTION: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Install GROMACS and application test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gromacs
          python scripts/lock_dependencies.py --check
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run a tiny simulation, checkpoint recovery and real trajectory analysis
        run: |
          gmx --version
          pytest -m gromacs_integration -v --basetemp=runtime/gromacs-integration-ci
      - name: Check browser upload through real worker, SSE and result download
        run: |
          python -m playwright install --with-deps chromium
          python scripts/check_live_browser.py --gmx /usr/bin/gmx --artifact-dir runtime/gromacs-integration-ci/browser
      - name: Preserve GROMACS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gromacs-integration-diagnostics
          path: runtime/gromacs-integration-ci
          retention-days: 3
